<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweetmore's World Cup Sweepstake - Fixtures & Results</title>
<style>
:root {
  --bg: #07121f; --panel: rgba(255,255,255,.08); --text: #eef6ff; --muted: #a9bfd6;
  --gold: #ffd166; --green: #2dd4bf; --red:#ff6b6b; --blue:#7dd3fc; --shadow: 0 18px 50px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body {
  margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(45,212,191,.24), transparent 34rem),
    radial-gradient(circle at 80% 15%, rgba(125,211,252,.22), transparent 32rem),
    radial-gradient(circle at bottom right, rgba(255,209,102,.14), transparent 28rem), var(--bg);
  min-height:100vh;
}
header { padding: 30px 22px 18px; max-width: 1320px; margin: 0 auto; }
h1 { margin:0; font-size: clamp(2rem, 5vw, 4.2rem); letter-spacing:-.06em; line-height:.96; }
.subtitle { margin-top: 14px; color: var(--muted); font-size: 1.05rem; max-width: 900px; }
.mainNav, .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
.mainNav { margin-top:24px; }
.controls { margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.12); }
button, select, .navLink {
  border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.1); color: var(--text);
  padding: 11px 14px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(10px);
}
select option { color:#07121f; }
button.active, .primary, .activeNav { background: var(--gold); color: #1c1600; border-color: transparent; font-weight: 900; }
.navLink { text-decoration:none; display:inline-flex; align-items:center; font-weight:900; }
main { max-width: 1320px; margin: 0 auto; padding: 0 22px 44px; }
.stats { display:grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap:12px; margin:16px 0 18px; }
.stat { background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:12px; box-shadow:var(--shadow); }
.stat small { color:var(--muted); display:block; } .stat strong { font-size:1.25rem; display:block; margin-top:4px; }
.loading { color:var(--muted); margin: 14px 0; }
.error { background:rgba(255,107,107,.13); border:1px solid rgba(255,107,107,.3); color:#ffc0c0; border-radius:20px; padding:14px 16px; margin:18px 0; }
.notice { margin: 16px 0; background: rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.26); border-radius: 22px; padding: 14px 16px; color: #ffe9a6; }

.fixtureList { display:grid; gap:14px; }
.dateGroup { margin-top: 18px; }
.dateTitle { font-size:1rem; font-weight:900; margin:0 0 8px; color:var(--gold); }
.match {
  background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  box-shadow: 0 10px 26px rgba(0,0,0,.22);
  padding:10px 12px;
  display:grid;
  grid-template-columns: 70px minmax(0, 1fr) 78px minmax(0, 1fr) 170px;
  gap:10px;
  align-items:center;
}
.matchNum { color:var(--muted); font-size:.78rem; }
.team {
  display:grid;
  grid-template-columns: 34px minmax(0,1fr);
  gap:8px;
  align-items:center;
  min-width:0;
}
.team.away {
  grid-template-columns: minmax(0,1fr) 34px;
  text-align:right;
}
.flag {
  width:32px; height:23px; border-radius:5px; overflow:hidden;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
}
.flag img { width:100%; height:100%; object-fit:cover; display:block; }
.name { font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.owner { color:var(--muted); font-size:.74rem; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.scoreBox { text-align:center; }
.score { font-size:1.35rem; font-weight:1000; letter-spacing:-.04em; }
.status {
  display:inline-block; margin-top:3px; padding:3px 7px; border-radius:999px;
  background:rgba(125,211,252,.14); border:1px solid rgba(125,211,252,.22); color:var(--blue);
  font-size:.68rem; font-weight:900;
}
.status.finished { background:rgba(45,212,191,.13); border-color:rgba(45,212,191,.28); color:var(--green); }
.matchMeta { display:flex; flex-wrap:wrap; gap:5px; justify-content:flex-end; color:var(--muted); font-size:.72rem; }
.chip {
  background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:4px 7px;
}
.red { color:var(--red); }
@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(2,1fr); }
  .match { grid-template-columns: 52px 1fr 62px 1fr; }
  .matchMeta { grid-column:1/-1; justify-content:center; }
}
@media (max-width: 620px) {
  .stats { grid-template-columns:1fr; }
  .match {
    grid-template-columns: 1fr 58px 1fr;
    gap:8px;
  }
  .matchNum { display:none; }
  .team { grid-template-columns:28px minmax(0,1fr); }
  .team.away { grid-template-columns:minmax(0,1fr) 28px; }
  .flag { width:28px; height:20px; }
  .name { font-size:.9rem; }
  .owner { font-size:.68rem; }
  .score { font-size:1.12rem; }
}
</style>
</head>
<body>
<header>
  <h1>📅 Fixtures & Results</h1>
  <div class="subtitle">World Cup fixtures and results.</div>

  <nav class="mainNav">
    <a class="navLink" href="index.html">Players & Teams</a>
    <a class="navLink activeNav" href="fixtures-results.html">Fixtures & Results</a>
    <a class="navLink" href="leaderboard.html">Leaderboard</a>
  </nav>

  <div class="controls">
    <button class="primary" id="refreshBtn">Refresh</button>
    <select id="statusFilter">
      <option value="all">All matches</option>
      <option value="played">Played only</option>
      <option value="unplayed">Unplayed only</option>
    </select>
    <select id="groupFilter"><option value="all">All groups</option></select>
    <select id="teamFilter"><option value="all">All teams</option></select>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat"><small>Total fixtures</small><strong id="statTotal">–</strong></div>
    <div class="stat"><small>Played</small><strong id="statPlayed">–</strong></div>
    <div class="stat"><small>Total goals</small><strong id="statGoals">–</strong></div>
    <div class="stat"><small>Total red cards</small><strong id="statReds">–</strong></div>
  </section>

  <div id="message" class="loading">Loading fixtures…</div>
  <section id="matches" class="fixtureList"></section>
</main>

<script>
const FIXTURES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXLo16qi8E9Tl6PCP5CN-_3F-fbpvUOhWPX7OG5NFSufys68MPlwVXbIV9nLe2VavMBt9w0BPlvOQT/pub?output=csv";
const PLAYERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ7Xz9f4blVUNfJiUNlIHfUXqvJfCf-6-Ai5IErYs_j4UMxXdjcouXQ-D9hc4hgL0jx9-jvtMKm6L3/pub?output=csv";

const TEAM_ALIASES = {
  "Korea Republic": "South Korea", "Korea Rep": "South Korea", "Korea Rep.": "South Korea",
  "USA": "United States", "United States of America": "United States",
  "Turkey": "Türkiye", "Turkiye": "Türkiye",
  "Ivory Coast": "Côte d’Ivoire", "Cote d'Ivoire": "Côte d’Ivoire", "Côte d'Ivoire": "Côte d’Ivoire", "Cote d’Ivoire": "Côte d’Ivoire",
  "Cape Verde": "Cabo Verde", "Curacao": "Curaçao", "Congo DR": "DR Congo", "Bosnia and Herz.": "Bosnia and Herzegovina"
};

const TEAM_FLAG_CODES = {
  "Argentina":"ar","Australia":"au","Austria":"at","Belgium":"be","Bosnia and Herzegovina":"ba","Brazil":"br",
  "Cabo Verde":"cv","Canada":"ca","Colombia":"co","Croatia":"hr","Curaçao":"cw","Czechia":"cz",
  "DR Congo":"cd","Ecuador":"ec","Egypt":"eg","England":"gb-eng","France":"fr","Germany":"de",
  "Ghana":"gh","Haiti":"ht","Iran":"ir","Iraq":"iq","Japan":"jp","Jordan":"jo","Mexico":"mx",
  "Morocco":"ma","Netherlands":"nl","New Zealand":"nz","Norway":"no","Panama":"pa","Paraguay":"py",
  "Portugal":"pt","Qatar":"qa","Saudi Arabia":"sa","Scotland":"gb-sct","Senegal":"sn","South Africa":"za",
  "South Korea":"kr","Spain":"es","Sweden":"se","Switzerland":"ch","Tunisia":"tn","Türkiye":"tr",
  "United States":"us","Uruguay":"uy","Uzbekistan":"uz","Côte d’Ivoire":"ci","Algeria":"dz"
};

const els = {
  refreshBtn: document.getElementById("refreshBtn"),
  statusFilter: document.getElementById("statusFilter"),
  groupFilter: document.getElementById("groupFilter"),
  teamFilter: document.getElementById("teamFilter"),
  message: document.getElementById("message"),
  matches: document.getElementById("matches"),
  statTotal: document.getElementById("statTotal"),
  statPlayed: document.getElementById("statPlayed"),
  statGoals: document.getElementById("statGoals"),
  statReds: document.getElementById("statReds")
};

let allMatches = [];
let teamOwners = {};

function normaliseTeam(name) {
  if (name === null || name === undefined) return "";
  let n = String(name).trim().replace(/\s+/g, " ");
  return TEAM_ALIASES[n] || n;
}
function flagUrl(team) {
  const code = TEAM_FLAG_CODES[normaliseTeam(team)];
  return code ? `https://flagcdn.com/w80/${code}.png` : "";
}
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
}
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (c === '"' && inQuotes && next === '"') { field += '"'; i++; }
    else if (c === '"') inQuotes = !inQuotes;
    else if (c === ',' && !inQuotes) { row.push(field); field = ""; }
    else if ((c === '\n' || c === '\r') && !inQuotes) {
      if (c === '\r' && next === '\n') i++;
      row.push(field); field = "";
      if (row.some(v => String(v).trim() !== "")) rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.some(v => String(v).trim() !== "")) rows.push(row);
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] ?? "").trim());
    return obj;
  });
}
async function fetchCSV(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Could not fetch CSV: ${res.status}`);
  return parseCSV(await res.text());
}
function getField(row, candidates) {
  for (const c of candidates) if (row[c] !== undefined) return row[c];
  const keys = Object.keys(row);
  for (const c of candidates) {
    const found = keys.find(k => k.toLowerCase().replace(/\s+/g,"") === c.toLowerCase().replace(/\s+/g,""));
    if (found) return row[found];
  }
  return "";
}
function num(value) {
  if (value === null || value === undefined || String(value).trim() === "") return null;
  const n = Number(String(value).trim());
  return Number.isFinite(n) ? n : null;
}
function matchPlayed(match) {
  return num(match.homeScore) !== null && num(match.awayScore) !== null;
}
function parseMatches(rows) {
  return rows.map(r => ({
    matchNum: getField(r, ["Match Num","Match Number","Match"]),
    roundNum: getField(r, ["Round Num","Round Number","Round"]),
    date: getField(r, ["Date"]),
    location: getField(r, ["Location","Venue","Stadium"]),
    homeTeam: normaliseTeam(getField(r, ["Home Team","Home Team ","Home"])),
    awayTeam: normaliseTeam(getField(r, ["Away Team","Away Team ","Away"])),
    group: getField(r, ["Group"]),
    homeScore: getField(r, ["Home Score","Home Goals","HG"]),
    awayScore: getField(r, ["Away Score","Away Goals","AG"]),
    homeRC: getField(r, ["Home RC","Home Red Cards","Home Reds"]),
    awayRC: getField(r, ["Away RC","Away Red Cards","Away Reds"])
  }));
}
function parseOwners(rows) {
  const owners = {};
  rows.forEach(r => {
    const player = getField(r, ["player","Player","Name"]);
    ["team1","team2","team3","team4","Team1","Team2","Team3","Team4","Team 1","Team 2","Team 3","Team 4"].forEach(k => {
      if (!r[k]) return;
      const team = normaliseTeam(r[k]);
      if (!team) return;
      if (!owners[team]) owners[team] = [];
      if (!owners[team].includes(player)) owners[team].push(player);
    });
  });
  return owners;
}
function formatDate(value) {
  if (!value) return "TBC";
  const d = new Date(value);
  if (!isNaN(d)) return new Intl.DateTimeFormat("en-GB", {weekday:"short", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"}).format(d);
  return value;
}
function dateHeading(value) {
  if (!value) return "Date TBC";
  const d = new Date(value);
  if (!isNaN(d)) return new Intl.DateTimeFormat("en-GB", {weekday:"long", day:"2-digit", month:"long", year:"numeric"}).format(d);
  return String(value).split(" ")[0];
}

async function loadFixtures() {
  try {
    showMessage("Loading fixtures…");
    const [fixtureRows, playerRows] = await Promise.all([fetchCSV(FIXTURES_CSV_URL), fetchCSV(PLAYERS_CSV_URL)]);
    allMatches = parseMatches(fixtureRows);
    teamOwners = parseOwners(playerRows);
    populateFilters();
    render();
    showMessage(`Loaded ${allMatches.length} fixtures. Last refreshed ${new Intl.DateTimeFormat("en-GB", {dateStyle:"medium", timeStyle:"short"}).format(new Date())}.`);
  } catch (err) {
    showMessage(err.message, true);
  }
}
function populateFilters() {
  const groups = [...new Set(allMatches.map(m => m.group).filter(Boolean))].sort();
  els.groupFilter.innerHTML = `<option value="all">All groups</option>` + groups.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join("");

  const teams = new Set();
  allMatches.forEach(m => { if (m.homeTeam) teams.add(m.homeTeam); if (m.awayTeam) teams.add(m.awayTeam); });
  els.teamFilter.innerHTML = `<option value="all">All teams</option>` + [...teams].sort().map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
}
function filteredMatches() {
  const status = els.statusFilter.value, group = els.groupFilter.value, team = els.teamFilter.value;
  return allMatches.filter(m => {
    const played = matchPlayed(m);
    return (status === "all" || (status === "played" && played) || (status === "unplayed" && !played))
      && (group === "all" || m.group === group)
      && (team === "all" || m.homeTeam === team || m.awayTeam === team);
  }).sort((a,b) => {
    const da = new Date(a.date), db = new Date(b.date);
    if (!isNaN(da) && !isNaN(db)) return da - db;
    return Number(a.matchNum || 0) - Number(b.matchNum || 0);
  });
}
function render() {
  renderStats();
  const matches = filteredMatches();
  if (!matches.length) {
    els.matches.innerHTML = `<div class="notice">No fixtures match your filters.</div>`;
    return;
  }
  const grouped = new Map();
  matches.forEach(m => {
    const key = dateHeading(m.date);
    if (!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(m);
  });
  els.matches.innerHTML = [...grouped.entries()].map(([date, ms]) => `
    <div class="dateGroup">
      <h2 class="dateTitle">${escapeHtml(date)}</h2>
      ${ms.map(renderMatch).join("")}
    </div>
  `).join("");
}
function renderStats() {
  const played = allMatches.filter(matchPlayed);
  const goals = played.reduce((n,m)=>n+(num(m.homeScore)||0)+(num(m.awayScore)||0),0);
  const reds = allMatches.reduce((n,m)=>n+(num(m.homeRC)||0)+(num(m.awayRC)||0),0);
  els.statTotal.textContent = allMatches.length;
  els.statPlayed.textContent = played.length;
  els.statGoals.textContent = goals;
  els.statReds.textContent = reds;
}
function ownerText(team) {
  const owners = teamOwners[normaliseTeam(team)] || [];
  if (!owners.length) return "Unowned";
  return `Owner${owners.length > 1 ? "s" : ""}: ${owners.join(", ")}`;
}
function renderMatch(m) {
  const played = matchPlayed(m);
  const score = played ? `${num(m.homeScore)} - ${num(m.awayScore)}` : "v";
  const homeRed = num(m.homeRC) || 0, awayRed = num(m.awayRC) || 0;
  const homeFlag = flagUrl(m.homeTeam), awayFlag = flagUrl(m.awayTeam);

  return `
    <article class="match">
      <div class="matchNum">#${escapeHtml(m.matchNum)}<br>${escapeHtml(m.group)}</div>

      <div class="team home">
        <span class="flag">${homeFlag ? `<img src="${homeFlag}" alt="">` : ""}</span>
        <div>
          <div class="name">${escapeHtml(m.homeTeam || "TBC")}</div>
          <div class="owner">${escapeHtml(ownerText(m.homeTeam))}</div>
        </div>
      </div>

      <div class="scoreBox">
        <div class="score">${score}</div>
        <div class="status ${played ? "finished" : ""}">${played ? "Result" : "TBC"}</div>
      </div>

      <div class="team away">
        <div>
          <div class="name">${escapeHtml(m.awayTeam || "TBC")}</div>
          <div class="owner">${escapeHtml(ownerText(m.awayTeam))}</div>
        </div>
        <span class="flag">${awayFlag ? `<img src="${awayFlag}" alt="">` : ""}</span>
      </div>

      <div class="matchMeta">
        <span class="chip">${escapeHtml(formatDate(m.date))}</span>
        ${m.location ? `<span class="chip">${escapeHtml(m.location)}</span>` : ""}
        ${homeRed || awayRed ? `<span class="chip red">RC ${homeRed}-${awayRed}</span>` : `<span class="chip">RC 0-0</span>`}
      </div>
    </article>
  `;
}
function showMessage(msg, isError=false) {
  els.message.className = isError ? "error" : "loading";
  els.message.textContent = msg;
}

els.refreshBtn.addEventListener("click", loadFixtures);
els.statusFilter.addEventListener("change", render);
els.groupFilter.addEventListener("change", render);
els.teamFilter.addEventListener("change", render);
loadFixtures();
</script>
</body>
</html>
