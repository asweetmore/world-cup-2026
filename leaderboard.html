<title>Sweetmore's World Cup Sweepstake - Leaderboard</title>
<style>

:root {
  --bg: #07121f; --panel: rgba(255,255,255,.08); --text: #eef6ff; --muted: #a9bfd6;
  --gold: #ffd166; --silver: #d8dee9; --bronze: #d7995b; --green: #2dd4bf; --red:#ff6b6b; --blue:#7dd3fc;
  --shadow: 0 18px 50px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(45,212,191,.24), transparent 34rem),
    radial-gradient(circle at 80% 15%, rgba(125,211,252,.22), transparent 32rem),

}
header { padding: 30px 22px 18px; max-width: 1320px; margin: 0 auto; }
h1 { margin:0; font-size: clamp(2rem, 5vw, 4.2rem); letter-spacing:-.06em; line-height:.96; }
.subtitle { margin-top: 14px; color: var(--muted); font-size: 1.05rem; max-width: 900px; }
.controls { display:flex; flex-wrap:wrap; gap:12px; margin-top:22px; align-items:center; }
button, select, .navLink {
  border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.1); color: var(--text);
  padding: 11px 14px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(10px);
}
select option { color:#07121f; }
button.active, .primary { background: var(--gold); color: #1c1600; border-color: transparent; font-weight: 900; }
.navLink { text-decoration:none; display:inline-flex; align-items:center; }
main { max-width: 1320px; margin: 0 auto; padding: 0 22px 44px; }
.error { background:rgba(255,107,107,.13); border:1px solid rgba(255,107,107,.3); color:#ffc0c0; border-radius:20px; padding:14px 16px; margin:18px 0; }
.loading { color:var(--muted); margin: 18px 0; }
.stats { display:grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap:14px; margin:16px 0 22px; }
.stat { background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:16px; box-shadow:var(--shadow); }
.stat small { color:var(--muted); display:block; } .stat strong { font-size:1.65rem; display:block; margin-top:4px; }
.flag { width:28px; height:20px; border-radius:5px; overflow:hidden; background:rgba(255,255,255,.12); flex: 0 0 auto; border:1px solid rgba(255,255,255,.2); }
.flag img { width:100%; height:100%; object-fit:cover; display:block; }
.meta { color: var(--muted); font-size:.84rem; margin-top:3px; }
.chip { background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:6px 9px; display:inline-flex; align-items:center; gap:6px; }
@media (max-width: 780px) { .stats { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 520px) { .stats { grid-template-columns:1fr; } }

.podium {
  display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:16px; margin: 18px 0 24px;
}
.podiumCard {

}

.podiumCard.second { border-color:rgba(216,222,233,.38); }
.podiumCard.third { border-color:rgba(215,153,91,.44); }

.board { display:grid; gap:12px; }

  background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.055));
  border:1px solid rgba(255,255,255,.14); border-radius: 22px; box-shadow:var(--shadow); padding: 14px 16px;

.teamScore strong { color:var(--text); }

<body>
<header>
  <h1>🏆 Current Leaderboard</h1>
  <div class="subtitle">Live table calculated from latest results. Ties are split by wins, goals scored, goals conceded, then red cards.</div>
  <div class="controls">
    <a class="navLink" href="index.html">Players & Teams</a>
    <a class="navLink" href="fixtures-results.html">Fixtures & Results</a>
    <button class="primary" id="refreshBtn">Refresh leaderboard</button>
    <select id="viewSelect">
      <option value="compact" selected>Compact view</option>
      <option value="expanded">Expanded view</option>
    </select>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat"><small>Leader</small><strong id="statLeader">–</strong></div>
    <div class="stat"><small>Most team goals</small><strong id="statMostGoals">–</strong></div>
    <div class="stat"><small>Most red cards</small><strong id="statMostReds">–</strong></div>
    <div class="stat"><small>Most goals conceded</small><strong id="statMostConceded">–</strong></div>
  </section>

  <div id="message" class="loading">Loading leaderboard…</div>
  <section id="podium" class="podium"></section>
  <h2 class="sectionTitle">The chasing pack</h2>
  <section id="board" class="board"></section>
  <section id="woodenSpoon" class="woodenSpoon"></section>
</main>

<script>
const FIXTURES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXLo16qi8E9Tl6PCP5CN-_3F-fbpvUOhWPX7OG5NFSufys68MPlwVXbIV9nLe2VavMBt9w0BPlvOQT/pub?output=csv";
const PLAYERS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ7Xz9f4blVUNfJiUNlIHfUXqvJfCf-6-Ai5IErYs_j4UMxXdjcouXQ-D9hc4hgL0jx9-jvtMKm6L3/pub?output=csv";

const TEAM_ALIASES = {
  "Korea Republic": "South Korea",
  "Korea Rep": "South Korea",
  "Korea Rep.": "South Korea",
  "USA": "United States",
  "United States of America": "United States",
  "Turkey": "Türkiye",
  "Turkiye": "Türkiye",
  "Ivory Coast": "Côte d’Ivoire",
  "Cote d'Ivoire": "Côte d’Ivoire",
  "Côte d'Ivoire": "Côte d’Ivoire",
  "Cote d’Ivoire": "Côte d’Ivoire",
  "Cape Verde": "Cabo Verde",
  "Curacao": "Curaçao",
  "Congo DR": "DR Congo",
  "Bosnia and Herz.": "Bosnia and Herzegovina"
};

const TEAM_FLAG_CODES = {
  "Argentina":"ar","Australia":"au","Austria":"at","Belgium":"be","Bosnia and Herzegovina":"ba","Brazil":"br",
  "Cabo Verde":"cv","Canada":"ca","Colombia":"co","Croatia":"hr","Curaçao":"cw","Czechia":"cz",
  "DR Congo":"cd","Ecuador":"ec","Egypt":"eg","England":"gb-eng","France":"fr","Germany":"de",
  "Ghana":"gh","Haiti":"ht","Iran":"ir","Iraq":"iq","Japan":"jp","Jordan":"jo","Mexico":"mx",
  "Morocco":"ma","Netherlands":"nl","New Zealand":"nz","Norway":"no","Panama":"pa","Paraguay":"py",
  "Portugal":"pt","Qatar":"qa","Saudi Arabia":"sa","Scotland":"gb-sct","Senegal":"sn","South Africa":"za",
  "South Korea":"kr","Spain":"es","Sweden":"se","Switzerland":"ch","Tunisia":"tn","Türkiye":"tr",
  "United States":"us","Uruguay":"uy","Uzbekistan":"uz","Côte d’Ivoire":"ci","Algeria":"dz"
};

function normaliseTeam(name) {
  if (name === null || name === undefined) return "";
  let n = String(name).trim().replace(/\s+/g, " ");
  return TEAM_ALIASES[n] || n;
}
function flagUrl(team) {
  const code = TEAM_FLAG_CODES[normaliseTeam(team)];
  return code ? `https://flagcdn.com/w80/${code}.png` : "";
}
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
}
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (c === '"' && inQuotes && next === '"') { field += '"'; i++; }
    else if (c === '"') inQuotes = !inQuotes;
    else if (c === ',' && !inQuotes) { row.push(field); field = ""; }
    else if ((c === '\n' || c === '\r') && !inQuotes) {
      if (c === '\r' && next === '\n') i++;
      row.push(field); field = "";
      if (row.some(v => String(v).trim() !== "")) rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.some(v => String(v).trim() !== "")) rows.push(row);
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] ?? "").trim());
    return obj;
  });
}
async function fetchCSV(url) {
  if (!url || url.includes("PASTE_")) throw new Error("Missing CSV URL. Add your published Google Sheet CSV link inside this HTML file.");
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Could not fetch CSV: ${res.status}`);
  return parseCSV(await res.text());
}
function getField(row, candidates) {
  for (const c of candidates) if (row[c] !== undefined) return row[c];
  const keys = Object.keys(row);
  for (const c of candidates) {
    const found = keys.find(k => k.toLowerCase().replace(/\s+/g,"") === c.toLowerCase().replace(/\s+/g,""));
    if (found) return row[found];
  }
  return "";
}
function num(value) {
  if (value === null || value === undefined || String(value).trim() === "") return null;
  const n = Number(String(value).trim());
  return Number.isFinite(n) ? n : null;
}
function matchPlayed(match) {
  return num(match.homeScore) !== null && num(match.awayScore) !== null;
}
function parseMatches(rows) {
  return rows.map(r => ({
    matchNum: getField(r, ["Match Num","Match Number","Match"]),
    roundNum: getField(r, ["Round Num","Round Number","Round"]),
    date: getField(r, ["Date"]),
    location: getField(r, ["Location","Venue","Stadium"]),
    homeTeam: normaliseTeam(getField(r, ["Home Team","Home Team ","Home"])),
    awayTeam: normaliseTeam(getField(r, ["Away Team","Away Team ","Away"])),
    group: getField(r, ["Group"]),
    homeScore: getField(r, ["Home Score","Home Goals","HG"]),
    awayScore: getField(r, ["Away Score","Away Goals","AG"]),
    homeRC: getField(r, ["Home RC","Home Red Cards","Home Reds"]),
    awayRC: getField(r, ["Away RC","Away Red Cards","Away Reds"])
  }));
}
function parsePlayers(rows) {
  return rows.map(r => ({
    player: getField(r, ["player","Player","Name"]),
    teams: [
      getField(r, ["team1","Team1","Team 1"]),
      getField(r, ["team2","Team2","Team 2"]),
      getField(r, ["team3","Team3","Team 3"]),
      getField(r, ["team4","Team4","Team 4"])
    ].map(normaliseTeam).filter(Boolean)
  })).filter(p => p.player && p.teams.length);
}
function scoreTeamInMatch(match, team) {
  team = normaliseTeam(team);
  const home = normaliseTeam(match.homeTeam);
  const away = normaliseTeam(match.awayTeam);
  if (team !== home && team !== away) return 0;
  if (!matchPlayed(match)) return 0;
  const isHome = team === home;
  const goalsFor = isHome ? num(match.homeScore) : num(match.awayScore);
  const goalsAgainst = isHome ? num(match.awayScore) : num(match.homeScore);
  const reds = isHome ? (num(match.homeRC) ?? 0) : (num(match.awayRC) ?? 0);
  let points = 0;
  if (goalsFor > goalsAgainst) points += 3;
  else if (goalsFor === goalsAgainst) points += 1;
  if (goalsAgainst === 0) points += 2;
  points += goalsFor;
  points -= reds;
  return points;
}
function calculateGroupData(matches) {
  const tables = {};
  matches.forEach(m => {
    if (!m.group || !matchPlayed(m)) return;
    const group = m.group;
    const home = normaliseTeam(m.homeTeam);
    const away = normaliseTeam(m.awayTeam);
    if (!home || !away) return;
    if (!tables[group]) tables[group] = {};
    for (const team of [home, away]) {
      if (!tables[group][team]) tables[group][team] = {team, group, played:0, wins:0, draws:0, losses:0, gf:0, ga:0, gd:0, pts:0};
    }
    const hg = num(m.homeScore) || 0, ag = num(m.awayScore) || 0;
    const h = tables[group][home], a = tables[group][away];
    h.played++; a.played++;
    h.gf += hg; h.ga += ag; a.gf += ag; a.ga += hg;
    if (hg > ag) { h.wins++; a.losses++; h.pts += 3; }
    else if (hg < ag) { a.wins++; h.losses++; a.pts += 3; }
    else { h.draws++; a.draws++; h.pts += 1; a.pts += 1; }
    h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;
  });
  const result = {};
  Object.values(tables).forEach(groupTable => {
    const teams = Object.values(groupTable).sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.ga - b.ga || a.team.localeCompare(b.team));
    const complete = teams.length === 4 && teams.every(t => t.played >= 3);
    teams.forEach((t, idx) => {
      result[t.team] = {...t, position: complete ? idx + 1 : null, groupBonus: complete ? (idx === 0 ? 2 : idx === teams.length - 1 ? -2 : 0) : 0};
    });
  });
  return result;
}


const els = {
  refreshBtn: document.getElementById("refreshBtn"),
  viewSelect: document.getElementById("viewSelect"),
  message: document.getElementById("message"),
  podium: document.getElementById("podium"),
  board: document.getElementById("board"),
  statLeader: document.getElementById("statLeader"),
  statMostGoals: document.getElementById("statMostGoals"),
  statMostReds: document.getElementById("statMostReds"),
  statMostConceded: document.getElementById("statMostConceded")
};

let leaderboard = [];

async function loadLeaderboard() {
  try {
    showMessage("Loading fixtures and players…");
    const [fixtureRows, playerRows] = await Promise.all([fetchCSV(FIXTURES_CSV_URL), fetchCSV(PLAYERS_CSV_URL)]);
    const matches = parseMatches(fixtureRows);
    const players = parsePlayers(playerRows);
    const groupData = calculateGroupData(matches);
    leaderboard = calculateLeaderboard(matches, groupData, players);
    renderStats(matches);
    renderBoard();
    showMessage(`Leaderboard refreshed ${new Intl.DateTimeFormat("en-GB", {dateStyle:"medium", timeStyle:"short"}).format(new Date())}.`);
  } catch (err) {
    showMessage(err.message, true);
  }
}

function calculateLeaderboard(matches, groupData, players) {
  return players.map(p => {
    const teamDetails = p.teams.map(team => {
      const t = normaliseTeam(team);
      const teamMatches = matches.filter(m => normaliseTeam(m.homeTeam) === t || normaliseTeam(m.awayTeam) === t);
      let wins=0, draws=0, goals=0, goalsConceded=0, cleanSheets=0, reds=0, matchPoints=0;
      teamMatches.forEach(m => {
        if (!matchPlayed(m)) return;
        const isHome = normaliseTeam(m.homeTeam) === t;
        const gf = isHome ? num(m.homeScore) : num(m.awayScore);
        const ga = isHome ? num(m.awayScore) : num(m.homeScore);
        const rc = isHome ? (num(m.homeRC)||0) : (num(m.awayRC)||0);
        if (gf > ga) wins++;
        if (gf === ga) draws++;
        if (ga === 0) cleanSheets++;
        goals += gf;
        goalsConceded += ga;
        reds += rc;
        matchPoints += scoreTeamInMatch(m, t);
      });
      const groupBonus = groupData[t]?.groupBonus || 0;
      const groupPosition = groupData[t]?.position || null;
      const total = matchPoints + groupBonus;
      return {team:t, wins, draws, goals, goalsConceded, cleanSheets, reds, matchPoints, groupBonus, groupPosition, total};
    });
    const total = teamDetails.reduce((n,t)=>n+t.total,0);
    const goals = teamDetails.reduce((n,t)=>n+t.goals,0);
    const reds = teamDetails.reduce((n,t)=>n+t.reds,0);
    const goalsConceded = teamDetails.reduce((n,t)=>n+t.goalsConceded,0);
    const wins = teamDetails.reduce((n,t)=>n+t.wins,0);
    const cleanSheets = teamDetails.reduce((n,t)=>n+t.cleanSheets,0);
    const groupBonus = teamDetails.reduce((n,t)=>n+t.groupBonus,0);
    return {player:p.player, teams:p.teams, total, goals, goalsConceded, reds, wins, cleanSheets, groupBonus, teamDetails};
  }).sort((a,b) =>
    b.total - a.total ||
    b.wins - a.wins ||
    b.goals - a.goals ||
    a.goalsConceded - b.goalsConceded ||
    a.reds - b.reds ||
    a.player.localeCompare(b.player)
  );
}

function renderStats(matches) {
  const mostGoals = [...leaderboard].sort((a,b)=>b.goals-a.goals || b.total-a.total)[0];
  const mostReds = [...leaderboard].sort((a,b)=>b.reds-a.reds || a.total-b.total)[0];
  const mostConceded = [...leaderboard].sort((a,b)=>b.goalsConceded-a.goalsConceded || a.total-b.total)[0];

  els.statLeader.textContent = leaderboard[0] ? `${leaderboard[0].player} (${leaderboard[0].total})` : "–";
  els.statMostGoals.textContent = mostGoals ? `${mostGoals.player} (${mostGoals.goals})` : "–";
  els.statMostReds.textContent = mostReds ? `${mostReds.player} (${mostReds.reds})` : "–";
  els.statMostConceded.textContent = mostConceded ? `${mostConceded.player} (${mostConceded.goalsConceded})` : "–";
}

function renderBoard() {
  const compact = els.viewSelect.value === "compact";
  const topThree = leaderboard.slice(0,3);
  const rest = leaderboard.length > 3 ? leaderboard.slice(3, -1) : [];

  els.podium.innerHTML = topThree.map((p,i) => renderPodium(p,i)).join("");
  document.querySelector(".sectionTitle").style.display = rest.length ? "block" : "none";
  els.board.innerHTML = rest.map((p, i) => renderRow(p, i + 4, compact)).join("");
  renderWoodenSpoon();
}

function podiumPrize(i) { return ["£110","£50","£25"][i] || ""; }


function renderWoodenSpoon() {
  const holder = document.getElementById("woodenSpoon");
  if (!holder || !leaderboard.length) return;
  const last = leaderboard[leaderboard.length - 1];
  const position = leaderboard.length;
  holder.innerHTML = `
    <article class="spoonCard podiumStyle">
      <div class="spoonTop">
        <div>
          <div class="spoonEmoji">🥄</div>
          <div class="spoonTitle">Wooden Spoon · ${position}${ordinalSuffix(position)}</div>
          <div class="spoonPlayer">${escapeHtml(last.player)}</div>
          <div class="spoonPts">${last.total} pts</div>
          <div class="prizeBadge">💷 £15</div>
        </div>
      </div>
    </article>
  `;
}
function ordinalSuffix(n) {
  const v = n % 100;
  if (v >= 11 && v <= 13) return "th";
  return ["th","st","nd","rd"][n % 10] || "th";
}

function renderPodium(p, i) {
  const medals = ["🥇","🥈","🥉"];
  const classes = ["first","second","third"];
  return `
    <article class="podiumCard ${classes[i]}">
      <div class="medal">${medals[i]}</div>
      <div class="podiumName">${escapeHtml(p.player)}</div>
      <div class="podiumPts">${p.total} pts</div>
      <div class="prizeBadge">💷 ${podiumPrize(i)}</div>
      <div class="meta">G ${p.goals} · GA ${p.goalsConceded} · W ${p.wins} · CS ${p.cleanSheets} · RC ${p.reds}</div>
      <div class="podiumTeams">
        ${p.teamDetails.map(t => `<span class="chip">${flagUrl(t.team) ? `<span class="flag"><img src="${flagUrl(t.team)}" alt=""></span>` : ""}${escapeHtml(t.team)} <strong>${t.total}</strong></span>`).join("")}
      </div>
    </article>
  `;
}

function renderRow(p, position, compact) {
  return `
    <article class="row">
      <div class="position">${position}</div>
      <div>
        <div class="playerName">${escapeHtml(p.player)}</div>
        <div class="meta">G ${p.goals} · GA ${p.goalsConceded} · W ${p.wins} · CS ${p.cleanSheets} · RC ${p.reds}</div>
        <div class="teams">
          ${p.teamDetails.map(t => `<span class="chip">${flagUrl(t.team) ? `<span class="flag"><img src="${flagUrl(t.team)}" alt=""></span>` : ""}${escapeHtml(t.team)}: <strong>${t.total}</strong></span>`).join("")}
        </div>
      </div>
      <div class="total"><small>Pts</small><br><strong>${p.total}</strong></div>
      ${compact ? "" : `<div class="details">${p.teamDetails.map(renderTeamDetail).join("")}</div>`}
    </article>
  `;
}

function renderTeamDetail(t) {
  const groupText = t.groupPosition ? `Group ${t.groupPosition}: ${t.groupBonus >= 0 ? "+" : ""}${t.groupBonus}` : `Group pending`;
  return `
    <div class="teamScore">
      <strong>${escapeHtml(t.team)}</strong>
      <span>W ${t.wins}</span>
      <span>D ${t.draws}</span>
      <span>G ${t.goals}</span>
      <span>GA ${t.goalsConceded}</span>
      <span>CS ${t.cleanSheets}</span>
      <span>RC ${t.reds}</span>
      <span class="${t.groupBonus >= 0 ? "pos" : "neg"}">${groupText}</span>
      <span><strong>${t.total} pts</strong></span>
    </div>
  `;
}

function showMessage(msg, isError=false) {
  els.message.className = isError ? "error" : "loading";
  els.message.textContent = msg;
}

els.refreshBtn.addEventListener("click", loadLeaderboard);
els.viewSelect.addEventListener("change", renderBoard);
loadLeaderboard();
</script>
</body>
</html>
